name: skin_lab
description: >-
  Throwaway viability spike for #249. Measures whether the Base* public
  signatures, as written today, can drive the canonical widgets of Material 3,
  iOS Cupertino and Fluent 2. Not shipped, not depended on by the app.
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.9.2

# Member of the app's pub workspace so fluent_ui resolves against the same
# Flutter/Dart SDK and the same shared transitive versions the app uses,
# WITHOUT fluent_ui entering the app's own dependencies. The app cannot reach
# this package: analysis_options.yaml keeps depend_on_referenced_packages at
# error severity (#383), so an import of package:skin_lab from lib/ fails the
# blocking analyze step.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The Fluent 2 / WinUI widget library the Fluent skin delegates to. Pinned so
  # the resolution answer recorded in FINDINGS.md stays reproducible.
  fluent_ui: ^4.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # fluent_ui declares `uses-material-design: true`; without this line every
  # run of the spike prints a warning that the primary pubspec disagrees.
  # Recorded as a Fluent-skin packaging constraint in FINDINGS.md.
  uses-material-design: true
