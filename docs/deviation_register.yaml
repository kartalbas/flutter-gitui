      affirmative action carries. A neutral third accent would leave the
      destructive variant's icon looking like every other dialog's, which is
      the one case where the glyph has to carry meaning on its own. The value
      registered here is the confirmation variant's, and the suite asserts the
      destructive variant's `error` next to it so this rationale cannot quietly
