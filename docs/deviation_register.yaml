  # BaseDialog (lib/shared/components/base_dialog.dart), measured against a
  # real `AlertDialog` pushed with `showDialog` through the same conformance
  # harness. The spec values are the generated `_DialogDefaultsM3` and
  # `AlertDialog`'s own layout defaults. Two tokens have to be pinned from
  # those sources rather than read off the pumped oracle, because this app's
  # `dialogTheme` overrides them (see the suite's library comment); the
  # entries affected say so.
  #
