    spec_value: secondary
    app_value: primary
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/dialog.dart:1976 (_DialogDefaultsM3.iconColor, colorScheme.secondary)"
    rationale: >
      Material 3 tints the dialog's hero icon `secondary` precisely so that it
      does not compete with the action row. This app gives the icon a different
      job: it says which of the three dialog variants is on screen. A
      destructive prompt draws it in `error`, the same role as its confirm
      button and its title, so the warning is readable before the text is; the
