  # role, surface tint, barrier, title role, content role and icon size all
  # measure the M3 value, so nothing about them is registered here.

  - id: DLG-001
    component: BaseDialog
    property: shape
    spec_value: 28.0
    app_value: 12.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/dialog.dart:1967 (_DialogDefaultsM3.shape, RoundedRectangleBorder with a 28.0 radius)"
    rationale: >
      Decided rather than inherited, and decided against the spec value. 28 dp
      is Material 3's extra-large corner, sized for a phone dialog that fills
      most of a small screen. This app ships to Windows and Linux, where the
      host dialogs are much squarer - Windows 11's own ContentDialog rounds at
      8 dp and libadwaita's dialogs at 12 - and a 28 dp arc on a 650 dp wide
      window reads as a mobile sheet rather than as a desktop dialog. 12 dp is
      also the corner this app's surfaces already carry: BaseCard and BasePanel
      both measure 12, and both reach it as the Material 3 default for a card,
      so a dialog at 12 stays in the same corner language as the panels and
      cards it hosts instead of introducing a radius more than twice theirs.
      The argument for 28 - that M3 separates the two shapes so a dialog reads
      as a distinct floating layer - is answered here by the properties that do
      conform: the dialog sits at elevation 6 on surfaceContainerHigh behind a
      54% black barrier, and none of those three was ever the corner's job.
    registered: 2026-08-07

  - id: DLG-002
