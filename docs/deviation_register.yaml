  - id: A11Y-001
    component: BaseSwitcher
    property: tapTargetHeight
    spec_value: 48.0
    app_value: 37.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/constants.dart:27 (kMinInteractiveDimension), asserted by flutter_test's androidTapTargetGuideline (packages/flutter_test/lib/src/accessibility.dart:777-780)"
    rationale: >
      The switcher is the repository, workspace and branch control in the app's
      top bar, and its height is that bar's height: 8 dp of padding above and
      below a 16 dp glyph and a 13 px label, inside a 1 dp outline. Growing it
      to 48 would grow the top bar on every screen by 11 dp of chrome that
      shows nothing, on a window where vertical space is spent on the commit
      list.

      The 48 dp figure is Android's touch-target guideline for a fingertip, not
      a WCAG AA requirement: WCAG 2.2's target-size criterion at AA (2.5.8) is
      24 by 24, which a 37 dp control clears with room to spare, and this app
      ships to Windows and Linux where the target is acquired with a mouse
      pointer. The horizontal dimension is not the issue either - a switcher is
      125 to 130 dp wide, so the target is large in the axis the pointer
      travels along.

      This is deliberately narrower than the argument the buttons make:
      BTN-002 and ICO-002 shrink only the *painted* container and keep a full
      48 dp hit area through the padded tap target. The switcher has no such
      padding, and this entry says so rather than implying it does.
    registered: 2026-08-07
