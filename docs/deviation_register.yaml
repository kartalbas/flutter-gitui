    spec_value: 40.0
    app_value: 32.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/icon_button.dart:1128 (_IconButtonDefaultsM3.minimumSize, Size(40.0, 40.0))"
    rationale: >
      M3 defines a single icon button size; dense desktop rows (file
      lists, toolbars, banners) need a compact visual. The hit area still
      meets 48 dp via the padded tap target, only the painted container
      shrinks.
    registered: 2026-08-06

  - id: ICO-003
