# Deviation register
#
# Every place where this app intentionally departs from the Material 3
# specification is recorded here, with the spec value, the app value, the
# reason, and the exact location of the spec value in the Flutter SDK sources
# (pinned to the SDK version the app builds with).
#
# The register is normative and executable. Conformance tests assert "spec
# value OR registered deviation", so an unregistered mismatch fails, and a
# registered entry whose value has come back into line also fails, as stale.
# Neither the code nor this file can drift silently.
#
# Type scale note: the sizes below are the `AppFontSize.medium` (default)
# values. The tiny/small/large user settings derive from medium by a single
# rule (x0.85 / x0.92 / x1.10, rounded to whole logical pixels) in
# lib/shared/theme/app_theme.dart (_fontSizeFactor). A user-selectable font
# size is an accessibility feature on top of the scale, not a deviation.
# Roles not listed here (titleMedium, titleSmall, bodySmall, labelLarge,
# labelMedium, labelSmall) use the M3 sizes unchanged, and every role keeps the
# M3 letterSpacing and height ratio.

version: 1

deviations:
  - id: TYPE-001
    component: TextTheme.displayLarge
    property: fontSize
    spec_value: 57.0
    app_value: 45.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/typography.dart:2097 (Typography.englishLike2021)"
    rationale: >
      The M3 display sizes are tuned for phone hero surfaces. On a dense
      desktop Git client a 57 px display line dwarfs the rows around it;
      45 px keeps the display role clearly dominant while staying
      proportionate to desktop reading distance.
    registered: 2026-08-06

  - id: TYPE-002
    component: TextTheme.displayMedium
    property: fontSize
    spec_value: 45.0
    app_value: 36.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/typography.dart:2098 (Typography.englishLike2021)"
    rationale: >
      Desktop-density tuning; keeps the display ramp monotonic (45/36/32)
      under the reduced displayLarge.
    registered: 2026-08-06

  - id: TYPE-003
    component: TextTheme.displaySmall
    property: fontSize
    spec_value: 36.0
    app_value: 32.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/typography.dart:2099 (Typography.englishLike2021)"
    rationale: >
      Desktop-density tuning; keeps the display ramp monotonic (45/36/32)
      under the reduced displayLarge.
    registered: 2026-08-06

  - id: TYPE-004
    component: TextTheme.headlineLarge
    property: fontSize
    spec_value: 32.0
    app_value: 28.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/typography.dart:2100 (Typography.englishLike2021)"
    rationale: >
      Desktop-density tuning: headlines top screen sections that sit much
      closer together than on a phone; 28/24/22 preserves the headline
      hierarchy without consuming vertical space.
    registered: 2026-08-06

  - id: TYPE-005
    component: TextTheme.headlineMedium
    property: fontSize
    spec_value: 28.0
    app_value: 24.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/typography.dart:2101 (Typography.englishLike2021)"
    rationale: >
      Desktop-density tuning; see TYPE-004.
    registered: 2026-08-06

  - id: TYPE-006
    component: TextTheme.headlineSmall
    property: fontSize
    spec_value: 24.0
    app_value: 22.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/typography.dart:2102 (Typography.englishLike2021)"
    rationale: >
      Desktop-density tuning; see TYPE-004.
    registered: 2026-08-06

  - id: TYPE-007
    component: TextTheme.titleLarge
    property: fontSize
    spec_value: 22.0
    app_value: 20.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/typography.dart:2103 (Typography.englishLike2021)"
    rationale: >
      Dialog and card titles at 22 px crowd desktop dialogs that open in
      quick succession; 20 px keeps titleLarge visually distinct from
      headlineSmall (22) above it in this app's ramp.
    registered: 2026-08-06

  - id: TYPE-008
    component: TextTheme.bodyLarge
    property: fontSize
    spec_value: 16.0
    app_value: 15.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/typography.dart:2109 (Typography.englishLike2021)"
    rationale: >
      Primary reading size for a data-dense desktop tool at typical desktop
      viewing distance; 15 px keeps list rows compact while staying above
      the 13 px secondary text.
    registered: 2026-08-06

  - id: TYPE-009
    component: TextTheme.bodyMedium
    property: fontSize
    spec_value: 14.0
    app_value: 13.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/typography.dart:2110 (Typography.englishLike2021)"
    rationale: >
      Secondary and supporting text one step under the reduced bodyLarge
      (15); keeps the body ramp strictly monotonic (15/13/12).
    registered: 2026-08-06

  # BaseButton (lib/shared/components/base_button.dart). The component maps
  # its variants onto FilledButton / OutlinedButton / TextButton; the spec
  # values below are those classes' generated M3 defaults. Corner radius is
  # documented in dp: the M3 stadium shape equals half the 40 dp reference
  # container.

  - id: BTN-001
    component: BaseButton
    property: shape
    spec_value: 20.0
    app_value: 8.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/filled_button.dart:645 (_FilledButtonDefaultsM3.shape, StadiumBorder = 20.0 dp at the 40 dp container)"
    rationale: >
      The 8 dp control corner is shared with text fields, cards and menus
      across this desktop app; a stadium pill would be the only fully
      rounded control on screen and would break the shared corner language.
    registered: 2026-08-06

  - id: BTN-002
    component: BaseButton.small
    property: containerHeight
    spec_value: 40.0
    app_value: 32.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/filled_button.dart:611 (_FilledButtonDefaultsM3.minimumSize, Size(64.0, 40.0))"
    rationale: >
      M3 defines a single button size; dense desktop rows (file lists,
      banners, tag chips) need a compact visual. The hit area still meets
      48 dp via the padded tap target, only the painted container shrinks.
    registered: 2026-08-06

  - id: BTN-003
    component: BaseButton.small
    property: labelTextStyle
    spec_value: labelLarge
    app_value: labelMedium
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/filled_button.dart:544 (_FilledButtonDefaultsM3.textStyle, textTheme.labelLarge)"
    rationale: >
      The compact 32 dp container of BTN-002 needs a label one step down
      the type scale to keep the label-to-container proportion of the
      stock size; labelLarge inside 32 dp reads cramped.
    registered: 2026-08-06

  - id: BTN-004
    component: BaseButton.small
    property: iconSize
    spec_value: 18.0
    app_value: 16.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/filled_button.dart:617 (_FilledButtonDefaultsM3.iconSize, 18.0)"
    rationale: >
      Matches the labelMedium step of BTN-003 inside the 32 dp container of
      BTN-002, and aligns with the app icon scale's AppTheme.iconS (16)
      used by dense tree and list icons.
    registered: 2026-08-06

  - id: BTN-005
    component: BaseButton.large
    property: containerHeight
    spec_value: 40.0
    app_value: 48.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/filled_button.dart:611 (_FilledButtonDefaultsM3.minimumSize, Size(64.0, 40.0))"
    rationale: >
      Kept for API stability: ButtonSize.large is the hero size for
      empty-state and onboarding actions, one visible step above the stock
      40 dp container and exactly the minimum tap target.
    registered: 2026-08-06

  - id: BTN-006
    component: BaseButton.ghost
    property: foregroundRole
    spec_value: primary
    app_value: onSurface
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/text_button.dart:518 (_TextButtonDefaultsM3.foregroundColor, colorScheme.primary)"
    rationale: >
      Ghost is the chrome-less neutral variant for toolbars and repeated
      row actions; a primary-colored label would read as a link and would
      collapse the deliberate distinction from the tertiary variant, which
      adopts the stock primary-colored M3 text button.
    registered: 2026-08-06
