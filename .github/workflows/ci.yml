name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Straight-to-master means every commit is the branch tip for only minutes, so
# tip-only cancellation (one group per ref) discarded nearly every verdict.
# Keying push runs by SHA gives each commit its own group, so a push run can
# never be superseded; non-push events (PRs, manual dispatch) keep latest-wins.
# Plain `cancel-in-progress: false` would NOT be enough: GitHub keeps only the
# newest *pending* run per group, so intermediate commits would still lose
# their verdict, just more quietly.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The whole repository, so the gate matches the command a developer
      # actually runs. A narrower scope let release/ and tools/ drift, and
      # anyone running `dart format .` then produced an unrelated diff on top
      # of their own change. Generated output is untracked and needs no
      # exclusion.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # The whole repository, for the same reason the format step covers it:
      # a narrower scope left tools/ unanalyzed and made the gate disagree
      # with the plain command a developer runs. lint_rules/ resolves as a
      # member of the root pub workspace and shares this analyzer, so the
      # plugin package is covered here together with the application sources.
      - name: Analyze application code
        run: flutter analyze

      # release/updater is a separate package, excluded from the root analysis
      # because the root has no resolution for its dependencies. It is the code
      # that downloads and unpacks an update, so it gets its own gate rather
      # than none: resolve it, then analyze it on its own terms.
      - name: Analyze the updater package
        working-directory: release/updater
        run: |
          dart pub get
          dart analyze

      # Blocking design-system gate: executes the avoid_* rules from
      # lint_rules/flutter_gitui_lint. `flutter analyze` never runs custom_lint
      # plugins, so without this step the rules are IDE-only advice. The flags
      # are explicit -- they match today's defaults, so an upstream default flip
      # cannot silently soften the gate.
      - name: Enforce design-system lint rules
        run: dart run custom_lint --fatal-infos --fatal-warnings

      # The custom_lint gate above can be silenced per line or per file with
      # an ignore comment; for the data-safety rule that silent escape is not
      # acceptable. The only sanctioned exception is the reviewable
      # "// confirmed-by: <where>" marker, so any ignore naming the rule under
      # lib/ fails the build. Scoped to lib/ on purpose: documentation and this
      # workflow may name the rule, application code may not silence it.
      - name: Forbid ignores of require_confirm_destructive
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE 'ignore(_for_file)?:.*require_confirm_destructive' lib/; then
            echo "::error::require_confirm_destructive must not be silenced with ignore comments; use a '// confirmed-by: <where>' marker in the confirming flow instead"
            exit 1
          fi

      # Same reasoning for the keyboard gate: the only sanctioned escape from
      # avoid_raw_shortcuts is the reviewable "// sanctioned-shortcuts:
      # <reason>" marker plus the rule's sanctioned-files snapshot, so any
      # ignore naming the rule under lib/ fails the build.
      - name: Forbid ignores of avoid_raw_shortcuts
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE 'ignore(_for_file)?:.*avoid_raw_shortcuts' lib/; then
            echo "::error::avoid_raw_shortcuts must not be silenced with ignore comments; use a '// sanctioned-shortcuts: <reason>' marker plus the rule's sanctioned-files snapshot instead"
            exit 1
          fi

      # And the same for the dialog route gate. A dialog opened with a
      # framework helper decides the barrier, the transition and the navigator
      # for every design language at once, which is the one decision a skin
      # exists to make - so an ignore comment naming this rule under lib/ is
      # not a local exception, it is the ban switched off for that file.
      - name: Forbid ignores of avoid_raw_dialog_route
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE 'ignore(_for_file)?:.*avoid_raw_dialog_route' lib/; then
            echo "::error::avoid_raw_dialog_route must not be silenced with ignore comments; open the dialog through Overlays.dialog or Overlays.dialogFrom instead"
            exit 1
          fi

      # Six locales, and every one of them carries every key in app_en.arb
      # today. Until now nothing ran this check: it printed a coverage report
      # and exited zero, so a locale could fall behind and every run still
      # looked like a pass -- and this project's own progress notes cited
      # "check_translations clean" as evidence while nothing invoked it (#445).
      # It now exits non-zero on a missing key, and this step is what asks.
      - name: Check translation coverage
        run: dart run tools/check_translations.dart

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Everything except the pixel comparisons. They are split off into their
      # own step below so the two verdicts stay legible: "the behaviour broke"
      # and "the rendering changed" are different findings and a reviewer
      # should be able to tell which one a red build is reporting without
      # reading the log.
      #
      # This still covers the golden *scenes*: golden_scene_smoke_test.dart is
      # untagged and builds every scene in the matrix in both brightnesses,
      # asserting it renders without an exception and without an overflow.
      - name: Run tests
        run: flutter test --exclude-tags golden --reporter expanded

      # The Material 3 conformance suite lives in the skin package it measures
      # (packages/gitui_skin_material, #249 P0), which is a separate workspace
      # member: the step above does not reach it. Run from that package's
      # directory, because the suite resolves its own deviation register
      # relative to the package root it is started in.
      - name: Run the Material skin conformance suite
        working-directory: packages/gitui_skin_material
        run: flutter test --exclude-tags golden --reporter expanded

      # A golden that has no baseline reports "golden file not found", which
      # reads like a broken test rather than a missing input. Saying so once,
      # up front, with the workflow that produces them, saves the next person
      # the search.
      - name: Verify golden baselines are committed
        shell: bash
        run: |
          set -euo pipefail
          count=$(find packages/gitui_skin_material/test/conformance/goldens/images -name '*.png' 2>/dev/null | wc -l)
          echo "committed golden baselines: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No golden baselines are committed under packages/gitui_skin_material/test/conformance/goldens/images. Run the 'Goldens' workflow (workflow_dispatch), download its golden-baselines artifact, review the images and commit them."
            exit 1
          fi

      # Blocking, and on ubuntu because that is where the baselines were
      # rasterised: text shaping and anti-aliasing differ per platform, so the
      # comparison is only meaningful on the machine that produced them. Every
      # golden test additionally carries `skip: !Platform.isLinux` in code, so
      # this step is the only place they actually execute.
      #
      # A drift of up to 0.5% of pixels is tolerated by the comparator in
      # packages/gitui_skin_material/test/conformance/goldens/flutter_test_config.dart,
      # which absorbs the anti-aliasing differences a Skia point release brings
      # without letting a real regression through.
      - name: Run golden tests
        working-directory: packages/gitui_skin_material
        run: flutter test --tags golden --reporter expanded test/conformance/goldens

  build:
    name: Build ${{ matrix.platform }}
    # Both gates, not just the analyzer: without the test dependency a red suite
    # still produces release-shaped artifacts for all three platforms.
    needs: [analyze, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          # Pinned deliberately: ubuntu-latest floats onto newer Ubuntu images and
          # raises the glibc floor of every produced bundle, which ships no libc
          # or libstdc++ of its own and therefore resolves both from the host.
          # 22.04 provides glibc 2.35, matching the core22 base the snap declares
          # (release/manifests/snap/snapcraft.yaml).
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libnotify-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build ${{ matrix.platform }}
        run: flutter build ${{ matrix.platform }} --release

      # Fails loudly if a future runner-image bump lifts the required glibc above
      # the core22 floor, instead of producing a binary that refuses to start on
      # Ubuntu 22.04 or Debian 12. Mirrors the gate in
      # release/docker/Dockerfile.linux-build.
      - name: Verify glibc floor
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cd build/linux/x64/release/bundle
          GLIBC_MAX=$(objdump -T flutter_gitui lib/*.so | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "highest required glibc: $GLIBC_MAX"
          { [ "${GLIBC_MAX%%.*}" -eq 2 ] && [ "${GLIBC_MAX#*.}" -le 35 ]; } || { echo "::error::bundle requires glibc $GLIBC_MAX, above the core22 floor 2.35"; exit 1; }

      - name: Collect build output
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            windows) cp -r build/windows/x64/runner/Release dist/flutter-gitui ;;
            linux)   cp -r build/linux/x64/release/bundle   dist/flutter-gitui ;;
            macos)   cp -r build/macos/Build/Products/Release/*.app dist/ ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-gitui-${{ matrix.platform }}
          path: dist/
          retention-days: 14
