  # BaseIconButton (lib/shared/components/base_button.dart). The component
  # maps its variants onto IconButton / IconButton.filled /
  # IconButton.outlined; the spec values below are the generated
  # _IconButtonDefaultsM3 defaults. IconButton exposes no public
  # defaultStyleOf seam, so the conformance suite pins them as cited
  # constants. Corner radius is documented in dp: the M3 stadium shape
  # equals half the 40 dp reference container.

  - id: ICO-001
    component: BaseIconButton
    property: shape
    spec_value: 20.0
    app_value: 8.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/icon_button.dart:1146 (_IconButtonDefaultsM3.shape, StadiumBorder = 20.0 dp at the 40 dp container)"
    rationale: >
      The 8 dp control corner is the one this app gives its small pressable
      controls, and an icon button is the closest neighbour of the labelled
      button that already carries it (BTN-001): the two stand side by side in
      every toolbar, so a stadium pill next to an 8 dp button would read as a
      different kind of control rather than as the same one without a label.
      The wider surfaces keep their own corners and are not part of this
      argument - cards and panels sit at 12 (both the M3 default they provably
      match), text fields at the 4 dp M3 gives OutlineInputBorder, and a menu
      surface at the 4 dp of the M3 popup menu.

      Unlike BaseButton, which takes that corner from the theme since #399,
      BaseIconButton names AppTheme.radiusM directly: FlexSubThemesData has a
      radius token for every button family except the icon button, so no
      configured token can reach an IconButton. app_theme.dart configures the
      button radii from that same constant, and theme_token_reach_test.dart
      asserts the two components still render the same corner, so the two
      cannot drift apart.
    registered: 2026-08-06

