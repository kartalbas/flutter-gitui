# The spike is throwaway measurement code. It deliberately imports the raw
# Material, Cupertino and Fluent widget classes that the app's design-system
# lint bans, because delegating to those canonical widgets IS the experiment.
# It therefore carries its own, minimal analysis contract instead of the app's,
# and the app excludes `spike/**` from its own analysis (see the repository
# root analysis_options.yaml).
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Frozen copies keep the upstream file's structure verbatim, including
    # doc comments that reference symbols this package does not import.
    - public_member_api_docs: false
