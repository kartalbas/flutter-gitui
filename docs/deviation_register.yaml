    app_value: onSurface @ 12%
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/switch.dart:2285 (_SwitchDefaultsM3.overlayColor, focused and unselected)"
    rationale: >
      The state-layer opacity is not written in the component: BaseSwitch
      passes no `overlayColor` at all, so the value comes from the app's
