  # BaseButton (lib/shared/components/base_button.dart). The component maps
  # its variants onto FilledButton / OutlinedButton / TextButton; the spec
  # values below are those classes' generated M3 defaults. Corner radius is
  # documented in dp: the M3 stadium shape equals half the 40 dp reference
  # container.

  - id: BTN-001
    component: BaseButton
    property: shape
    spec_value: 20.0
    app_value: 8.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/filled_button.dart:645 (_FilledButtonDefaultsM3.shape, StadiumBorder = 20.0 dp at the 40 dp container)"
    rationale: >
      This desktop app uses a graded corner scale rather than one radius:
      8 dp on the small pressable controls (buttons and chips), 12 dp on the
      surfaces that hold them (cards and panels), and the 4 dp that M3's own
      OutlineInputBorder gives text fields. A stadium pill would be the only
      fully rounded control on any screen, and it reads as a mobile call to
      action next to a dense toolbar. The earlier wording here claimed the
      8 dp corner was shared with text fields; it is not, and their 4 dp is
      the SDK default they provably match (FIELD family).

      Since #399 the 8 dp is no longer written in the component. BaseButton
      leaves shape unset so ButtonStyleButton resolves it from the theme, and
      app_theme.dart configures filledButtonRadius, outlinedButtonRadius and
      textButtonRadius from AppTheme.radiusM. Only the source moved, from a
      widget constant to a theme token; the suite still measures what the
      component renders, so this entry stays asserted - and if the token ever
      stops arriving, the button falls back to the M3 stadium and this entry
      fails as stale rather than passing quietly.
    registered: 2026-08-06

  - id: BTN-002
    component: BaseButton.small
    property: containerHeight
    spec_value: 40.0
    app_value: 32.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/filled_button.dart:611 (_FilledButtonDefaultsM3.minimumSize, Size(64.0, 40.0))"
    rationale: >
      M3 defines a single button size; dense desktop rows (file lists,
      banners, tag chips) need a compact visual. The hit area still meets
      48 dp via the padded tap target, only the painted container shrinks.
    registered: 2026-08-06

  - id: BTN-003
