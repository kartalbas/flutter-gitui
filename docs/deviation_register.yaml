  - id: FAB-001
    component: BaseSpeedDial.miniFab
    property: shape
    spec_value: 12.0
    app_value: 16.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/floating_action_button.dart:818 (_FABDefaultsM3.shape, _FloatingActionButtonType.small)"
    rationale: >
      Material 3 gives the 56 dp button a 16 dp corner and the 40 dp one a 12,
      because it sizes each corner to the button it belongs to and expects a
      floating button to appear on its own. In a speed dial they do not appear
      on their own: the action buttons stand in a single column directly above
      the dial's own button, aligned on the same right edge, so their corners
      are read against each other rather than against the screen. One corner
      keeps the column reading as one control instead of as a stack of
      differently rounded ones.

      The value is not invented for this component. It is the app's
      `fabRadius` token (AppTheme.radiusXL, configured in app_theme.dart), and
      it is Material 3's own regular-FAB corner, which the dial's main button
      measures and conforms to - so this entry says only that the smaller
      button adopts the larger one's corner, not that the app chose a corner of
      its own.
