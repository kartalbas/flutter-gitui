name: flutter_gitui
description: Flutter-based Git GUI - Modern, cross-platform Git interface
publish_to: 'none'
version: 0.5.21-alpha

environment:
  sdk: ^3.9.2

# custom_lint merges the plugin's dependencies with this app's into one
# generated client; that merge is unsatisfiable if the two resolve analyzer
# independently, so the plugin resolves as a member of this workspace.
workspace:
  - lint_rules/flutter_gitui_lint
  # Throwaway viability spike for #249 (see spike/skin_lab/FINDINGS.md). It is
  # a workspace member so `fluent_ui` resolves against this Flutter/Dart SDK
  # and these shared transitive versions without ever entering this package's
  # `dependencies`. The workspace-isolation gate below
  # (depend_on_referenced_packages: error) keeps lib/ unable to import it.
  - spike/skin_lab
  # The skin contract (#249, P1): the vocabularies, the specs and the 55
  # members every skin implements. A workspace member so it resolves against
  # this Flutter/Dart SDK and these shared transitive versions, and
  # deliberately NOT in this package's `dependencies` yet - nothing in lib/
  # calls the contract before P2, and the workspace-isolation gate below
  # (depend_on_referenced_packages: error) is what makes that absence
  # enforced rather than merely true today.
  - packages/gitui_skin_api
  # The blueprint skin (#249, P1): the development-only instrument that renders
  # every contract member naked, so that anything still looking styled is
  # design that leaked into application code. A workspace member for the same
  # reason as the contract it implements, and equally absent from this
  # package's `dependencies` - it is registered by `lib/main.dart` from P2
  # onwards and reachable from nowhere else.
  - packages/gitui_skin_blueprint
  # The Material 3 skin (#249, P0). It holds this design language's
  # conformance suite and its own deviation register - the measurements that
  # were filed under this package's `test/` and `docs/` until the skins became
  # separable. A workspace member so it resolves against this Flutter/Dart SDK
  # and these shared transitive versions; it depends on this package (the
  # application it measures), and this package depends on nothing in it.
  - packages/gitui_skin_material

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0              # Robust state management
  hooks_riverpod: ^3.1.0                 # Riverpod + Flutter hooks integration
  riverpod: ^3.1.0                       # Core Riverpod library
  riverpod_annotation: ^4.0.0            # Code generation for riverpod

  # Navigation
  go_router: ^17.3.0                     # Declarative routing

  # UI Components
  cupertino_icons: ^1.0.9
  flutter_hooks: ^0.21.3+1                 # React-style hooks

  # Theming
  flex_color_scheme: ^8.4.0              # Beautiful Material Design 3 themes
  google_fonts: ^8.2.0                   # Google Fonts

  # Desktop Support
  window_manager: ^0.5.2                 # Window control
  window_size:                            # Window size management
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size
      # Pinned: 'main' floats, so a release could silently ship a different plugin.
      ref: eb3964990cf19629c89ff8cb4a37640c7b3d5601
  file_picker: ^11.0.2                    # File/folder dialogs
  url_launcher: ^6.3.2                   # Launch external apps
  path_provider: ^2.1.6                  # Standard directories
  desktop_drop: ^0.7.1                   # Drag and drop files
  shared_preferences: ^2.5.5             # Persistent key-value storage

  # Git Operations (Multiple options - see GIT_PACKAGES.md)
  process_run: ^1.3.4+1                    # Run git CLI (recommended)
  path: ^1.9.1                           # Path manipulation
  watcher: ^1.2.1                        # File system change notifications

  # Alternative: Native Git library
  # libgit2dart: ^1.8.1                  # Dart bindings to libgit2

  # Storage & Settings
  yaml: ^3.1.3                           # YAML configuration files

  # UI Utilities
  intl: ^0.20.2                          # Internationalization
  collection: ^1.19.1                     # Collection utilities

  # Charts & Visualization
  fl_chart: ^1.2.0                      # Charts for statistics

  # File Viewers
  flutter_markdown_plus: ^1.0.12          # Markdown rendering (maintained fork)
  csv: ^8.0.0                            # CSV parsing for spreadsheets
  photo_view: ^0.15.0                    # Image zoom/pan viewer

  # Time & Dates
  timeago: ^3.7.1                        # Relative time (2 hours ago)

  # Icons
  phosphor_flutter: ^2.1.0               # Beautiful icon set
  flutter_svg: ^2.3.0                   # SVG rendering for country flags

  # Utilities
  freezed_annotation: ^3.1.0             # Immutable models
  json_annotation: ^4.9.0                # JSON serialization
  equatable: ^2.1.0                      # Value equality
  uuid: ^4.6.0                           # UUID generation
  http: ^1.6.0                           # HTTP client for GitHub/GitLab APIs
  # Held at 9.x: package_info_plus >=10.1 requires win32 ^6, which no stable
  # file_picker uses (only the 12.x beta does), so 10.x needs a prerelease
  # file_picker. Revisit once a stable file_picker moves to win32 6.
  package_info_plus: ^9.0.1              # App version info
  crypto: ^3.0.7                         # SHA-256 verification of downloaded updates

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Custom Lint Rules for UI enforcement
  custom_lint: ^0.8.1
  flutter_gitui_lint:
    path: lint_rules/flutter_gitui_lint

  # The skin contract and the instrument that falsifies it (#249, P1). They are
  # DEV dependencies on purpose, and the distinction is the whole isolation
  # gate: `test/skin/pump_under_skin.dart` has to construct a BlueprintSkin to
  # run the zero-and-extremes sweep over the real screens, while `lib/` must
  # still be unable to name either package before P2. `depend_on_referenced_
  # packages` at error severity (analysis_options.yaml, #383) is what enforces
  # that asymmetry; at P2 the two move into `dependencies:` in the same commit
  # that gives main.dart its `SkinRegistry.register` line.
  gitui_skin_api:
    path: packages/gitui_skin_api
  gitui_skin_blueprint:
    path: packages/gitui_skin_blueprint

  # Code Generation
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2

  # Testing
  mockito: ^5.6.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  # Assets
  assets:
    - assets/changelog.json
    # Country flags for language selector
    - assets/flags/
    # Google Fonts - bundled locally for offline use
    # Each font directory must be listed individually
    - assets/google_fonts/anonymouspro/
    - assets/google_fonts/courierprime/
    - assets/google_fonts/dmmono/
    - assets/google_fonts/firacode/
    - assets/google_fonts/ibmplexmono/
    - assets/google_fonts/inconsolata/
    - assets/google_fonts/inter/
    - assets/google_fonts/jetbrainsmono/
    - assets/google_fonts/notosansmono/
    - assets/google_fonts/overpassmono/
    - assets/google_fonts/robotomono/
    - assets/google_fonts/sourcecodepro/
    - assets/google_fonts/spacemono/
