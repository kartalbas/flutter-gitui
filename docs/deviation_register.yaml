  - id: MENU-001
    component: MenuItemContent
    property: labelTextStyle
    spec_value: "titleSmall (fontSize 14.0, weight FontWeight.w500)"
    app_value: "bodyLarge (fontSize 15.0, weight FontWeight.w400)"
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/popup_menu.dart:1849 (_PopupMenuDefaultsM3.labelTextStyle, textTheme.labelLarge)"
    rationale: >
