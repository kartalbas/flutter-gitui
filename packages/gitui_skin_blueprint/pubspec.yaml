name: gitui_skin_blueprint
description: >-
  The blueprint skin for Flutter GitUI (#249): the development-only design
  language that renders every one of the contract's 55 members naked - a
  button is a square, a field is a box, a chip is a rectangle. Two colours, a
  1px outline and zero of everything else. Render the application under it and
  anything that still looks styled is design that leaked out of a skin and
  into application code.
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.9.2

# Member of the app's pub workspace so this package resolves against the same
# Flutter/Dart SDK and the same shared transitive versions every other member
# uses. It is deliberately NOT in the app's `dependencies:` - nothing in lib/
# calls a skin before P2, and the workspace-isolation gate
# (analysis_options.yaml, depend_on_referenced_packages at error severity,
# #383) is what makes that absence enforced rather than merely true today.
resolution: workspace

dependencies:
  # The only two dependencies, and the whole point. `gitui_skin_api` is the
  # contract this package implements; `flutter` is present because every
  # library here imports `package:flutter/widgets.dart` and NOTHING else from
  # Flutter. That single fact is the compile-time proof the blueprint exists
  # to carry: if a `ThemeExtension`, a `WidgetState`, an `InputBorder` or any
  # other design-language type ever enters the contract, this package stops
  # compiling and the blocking analysis step reddens.
  flutter:
    sdk: flutter
  gitui_skin_api:
    path: ../gitui_skin_api

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The design-system lint gate, present for one reason: a package is only its
  # own `custom_lint` context root if it depends on the plugin, and only its
  # own context root reads its own `analysis_options.yaml`. Without these two
  # lines this package's files are analysed under the APPLICATION's options,
  # where `avoid_text_with_style` points at a `BaseLabel` layer a skin package
  # cannot reach and must not obey - see the reasoning in
  # `analysis_options.yaml`. The same arrangement is what lets the Material
  # skin package silence the rules it has to silence at P2.
  custom_lint: ^0.8.1
  flutter_gitui_lint:
    path: ../../lint_rules/flutter_gitui_lint

# No `uses-material-design: true`. This package renders no Material icon font
# and asks for none: a blueprint that quietly depended on Material's assets
# would weaken the proof its own build is supposed to be.
