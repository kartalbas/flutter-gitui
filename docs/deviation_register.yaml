  # BaseCard (lib/shared/components/base_card.dart). The component is the
  # app's Material 3 outlined card, so the spec values below are the
  # generated `_OutlinedCardDefaultsM3` defaults, measured by pumping
  # `Card.outlined` through the same conformance harness and reading it with
  # the same probes.

  - id: CARD-001
    component: BaseCard
    property: containerColor
    spec_value: surface
    app_value: surfaceContainerHigh
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/card.dart:383 (_OutlinedCardDefaultsM3.color, colorScheme.surface)"
    rationale: >
      An outlined card at `surface` is only distinguishable from what it sits
      on when that background is lower on the tonal ladder. In this app a card
      is routinely nested inside a BasePanel, whose own container is
      `surfaceContainerLow` — a `surface` card would then be *lighter* than
      the panel holding it and read as being behind it. Sitting one step up at
      `surfaceContainerHigh` keeps the nesting order legible on every surface
      the app places a card on: scaffold, panel and dialog.
    registered: 2026-08-07

  - id: CARD-002
    component: BaseCard
    property: margin
    spec_value: 4.0
    app_value: 0.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/card.dart:376 (_OutlinedCardDefaultsM3 margin, EdgeInsets.all(4.0))"
    rationale: >
      The gap between cards belongs to the collection that lays them out — a
      grid's spacing, a list's separator — and every such collection in this
      app spends the shared 8/16/24 spacing scale. A 4 dp margin baked into
      the card would compound with that spacing and, worse, would offset a
      card from the panels and toolbars it has to align with, since those
      carry no margin of their own.
    registered: 2026-08-07

  - id: CARD-003
    component: BaseCard
    property: overlay.focused
    spec_value: "#1F000000"
    app_value: none
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/ink_well.dart:1039 (InkWell focus highlight, ThemeData.focusColor)"
    rationale: >
      A card collection is a composite widget: the grid is a single Tab stop
      and the highlight roves inside it with the arrow keys
      (lib/shared/widgets/keyboard_navigable_view.dart:520-524). Letting each
      card request focus would put one Tab stop per card in the traversal
      order and make Tab, not the arrow keys, the way through a grid. The
      focus indication is therefore carried by the card's emphasized border,
      driven by `containerHasFocus`, instead of by a per-card focus layer.
    registered: 2026-08-07

  # BaseListItem (lib/shared/components/base_list_item.dart). The spec values
  # below are the generated `_LisTileDefaultsM3` defaults, measured by pumping
  # a real `ListTile` through the same conformance harness and reading it with
  # the same probes.

  - id: LIST-001
    component: BaseListItem
    property: contentPadding.vertical
    spec_value: 8.0
    app_value: 16.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/list_tile.dart:1831 (_LisTileDefaultsM3 minVerticalPadding, 8)"
    rationale: >
      Material 3 does not derive a row's height from padding at all: ListTile
      picks 56, 72 or 88 dp from the number of text lines it was given and
      uses `minVerticalPadding` only as the floor for content that outgrows
      that ladder. BaseListItem cannot do the same, because its content slot
      is an opaque widget whose line count it never learns. 16 dp reproduces
      the ladder from a single constant instead: one line lands on the 56 dp
      minimum, and two lines — the app's commit, file and repository rows —
      land within a pixel of the M3 two-line height of 72 dp. Halving it to 8
      would collapse every two-line row to 56 and lose the M3 distinction
      between a one-line and a two-line item.
    registered: 2026-08-07

  - id: LIST-002
    component: BaseListItem
    property: overlay.focused
    spec_value: "#1F000000"
    app_value: none
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/ink_well.dart:1039 (InkWell focus highlight, ThemeData.focusColor)"
    rationale: >
      A list is a composite widget: the collection is a single Tab stop and
      the highlight roves inside it with the arrow keys
      (lib/shared/widgets/keyboard_navigable_view.dart:520-524). Letting each
      row request focus would put one Tab stop per row in the traversal order,
      so tabbing out of a thousand-commit history would take a thousand
      presses. The focus indication is therefore carried by the row's ring,
      driven by `containerHasFocus`, instead of by a per-row focus layer. Same
      argument as CARD-003.
    registered: 2026-08-07

  # BasePanel (lib/shared/components/base_panel.dart). A panel is two M3
  # components stacked, so it is measured against two oracles: the elevated
  # `Card` for the container and the `ExpansionTile` header — itself a
  # `ListTile` — for the title row. Both are pumped through the same
  # conformance harness and read with the same probes.

  - id: PANEL-001
    component: BasePanel.header
    property: contentPadding.start
    spec_value: 16.0
    app_value: 24.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/list_tile.dart:1829 (_LisTileDefaultsM3.contentPadding, EdgeInsetsDirectional.only(start: 16.0, end: 24.0))"
    rationale: >
      A panel header is not a free-standing list row: it sits directly above
      the panel's own content, separated only by a divider, and the eye reads
      the two as one column. The header therefore has to start on the same
      optical left edge as that content, which is the panel's content padding
      (AppTheme.paddingL, 24). The M3 list-item inset of 16 would offset every
      panel title from everything underneath it by 8 px. The trailing inset,
      where no such alignment exists, keeps the M3 24 dp.
    registered: 2026-08-07

  - id: PANEL-002
    component: BasePanel
    property: margin
    spec_value: 4.0
    app_value: 0.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/card.dart:306 (_CardDefaultsM3 margin, EdgeInsets.all(4.0))"
    rationale: >
      A panel is a layout region, not a floating card: it is placed by split
      views and screen scaffolds that own the gap between regions and spend
      the shared 8/16/24 spacing scale on it. A 4 dp margin baked into the
      panel would compound with that gap and would misalign a panel against
      the toolbars and rails it has to line up with. Same argument as
      CARD-002.
    registered: 2026-08-07

  # The input components (BaseTextField, BaseDropdown, BaseDateField,
  # lib/shared/components/). All three render through `InputDecorator`, so all
  # three are measured against the SDK widget that owns it — a real `TextField`
  # or `DropdownButtonFormField` carrying an `OutlineInputBorder` — pumped
  # through the same conformance harness and read with the same probes.

  - id: FIELD-001
    component: BaseTextField
    property: prefixIcon.size
    spec_value: 24.0
    app_value: 20.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/input_decorator.dart:2448 (icon size for a non-dense decoration, 24.0)"
    rationale: >
      A field's leading glyph is an adornment that names the field, not a
      control: at the M3 24 dp it is taller than the 15 dp line of text it
      introduces and pulls the eye away from the value. 20 dp is the app's
      compact icon step (AppTheme.iconM), already registered as the default
      icon-button glyph in ICO-004, so every leading glyph in a desktop form —
      field, dropdown and date field — sits on one size instead of three.
    registered: 2026-08-07

  - id: FIELD-002
    component: BaseTextField
    property: filled.bottomCornerRadius
    spec_value: 0.0
    app_value: 4.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/input_border.dart:155-158 (UnderlineInputBorder.borderRadius, top corners only)"
    rationale: >
      Material 3's filled field rounds only its top corners because its bottom
      edge is the active indicator, a line the shape has to run into. The
      filled variant here has no indicator (FIELD-003), so a square bottom edge
      would read as a box that has been cut off rather than as a field. All
      four corners at the shared 4 dp control corner keep it a self-contained
      surface — which is what its one job needs, since it is the app's inline
      search box: a rounded, chrome-less field that sits inside toolbars,
      overlays and dropdown popovers rather than in a form.
    registered: 2026-08-07

  - id: FIELD-003
    component: BaseTextField
    property: filled.activeIndicator
    spec_value: onSurfaceVariant 1.0 dp
    app_value: none
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/input_decorator.dart:5991 (_InputDecoratorDefaultsM3.activeIndicatorBorder, resting)"
    rationale: >
      The active indicator is M3's affordance for a filled field standing in a
      form, where a row of underlines marks the fields apart from the text
      around them. The filled variant is not used that way here: it is the
      inline search box inside a toolbar or a dropdown popover, where the fill
      alone already separates it from its surroundings and a single dark line
      under it reads as a divider between two toolbar regions. The two states
      that must stay visible do stay visible — focus draws the full `primary`
      outline at 2 dp and an error draws it in `error` — so the field is never
      without a state indication, only without a resting one.
    registered: 2026-08-07

  - id: DROP-001
    component: BaseDropdown
    property: prefixIcon.size
    spec_value: 24.0
    app_value: 20.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/input_decorator.dart:2448 (icon size for a non-dense decoration, 24.0)"
    rationale: >
      Same argument as FIELD-001, and the same value: a dropdown stands next to
      a BaseTextField in every dialog that uses one, so their leading glyphs
      have to be the same size or the form reads as two different controls.
    registered: 2026-08-07

  - id: DATE-001
    component: BaseDateField
    property: suffixIcon.size
    spec_value: 24.0
    app_value: 20.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/input_decorator.dart:2448 (icon size for a non-dense decoration, 24.0)"
    rationale: >
      Same argument and value as FIELD-001, applied to the trailing slot: the
      calendar glyph marks the field as pickable and has to match the leading
      glyphs of the fields it is stacked with. It also has to match the clear
      button that replaces it once a date is set, which is a
      BaseIconButton(small) carrying a 16 dp glyph inside a 32 dp container —
      a 24 dp calendar would make the field's trailing slot jump on the first
      pick.
    registered: 2026-08-07

  # The chip family (lib/shared/components/base_filter_chip.dart), measured
  # against `FilterChip`, `ChoiceChip` and `ActionChip` pumped through the same
  # conformance harness. Both entries below describe one decision: a filter bar
  # marks a selected chip with color, never with a checkmark.

  - id: CHIP-001
    component: BaseFilterChip
    property: selected.border
    spec_value: transparent 1.0 dp
    app_value: secondary 1.0 dp
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/filter_chip.dart:386-390 (_FilterChipDefaultsM3.side, transparent while selected)"
    rationale: >
      M3 drops the outline of a selected chip because its checkmark already
      says "selected". With the checkmark gone (CHIP-002) the container tint
      would be the only signal left, and a tonal fill alone is a weak one on a
      desktop toolbar seen at arm's length — and no signal at all for a user
      who cannot separate the two tints. Turning the outline that is already
      there from `outlineVariant` to `secondary` adds a second, non-colour-only
      cue (the outline gains contrast against the fill) at zero layout cost,
      because the width stays at the M3 1 dp.
    registered: 2026-08-07

  - id: CHIP-002
    component: BaseFilterChip
    property: selected.widthDelta
    spec_value: 20.0
    app_value: 0.0
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/filter_chip.dart:313 (_FilterChipDefaultsM3 showCheckmark: true)"
    rationale: >
      The M3 checkmark slides in front of the label and makes the chip 20 dp
      wider. This app's filter bars hold six to ten chips in one wrapping row
      above a list, and toggling one filter would then reflow the whole row and
      move every chip after it — including the one the pointer is over, so a
      second click lands on a different filter. Keeping one width per chip
      makes the row stable under repeated toggling, which is how filters are
      actually used here. The property is measured as the width selection adds,
      because the checkmark is painted by the chip's render object rather than
      built as a widget.
    registered: 2026-08-07

  - id: CHIP-003
    component: BaseChoiceChip
    property: selected.border
    spec_value: transparent 1.0 dp
    app_value: secondary 1.0 dp
    spec_source: "Flutter 3.44.4 packages/flutter/lib/src/material/choice_chip.dart:353-357 (_ChoiceChipDefaultsM3.side, transparent while selected)"
    rationale: >
