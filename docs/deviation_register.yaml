      things the rows behind them do - branch names, file paths, remotes,
      commit subjects - and the user reads a menu entry and the row it acts on
      in one glance. Setting the entry at the app's body size keeps those two
      readings at the same size instead of shrinking a name by a step the
      moment it moves into a menu. The size also has to hold across the whole
      family: `MenuItemLabel` builds menu entries too, and additionally serves
